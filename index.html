<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Чат</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #4a90e2;
      --blue-dark: #3a7bd5;
      --gray: #f0f2f5;
      --border: #e4e6ea;
      --text: #1c1e21;
      --muted: #65676b;
      --white: #ffffff;
      --bubble-me: #0084ff;
      --bubble-other: #e4e6ea;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray);
      color: var(--text);
      font-size: 16px;
      overflow-x: hidden;
    }

    /* SCREENS */
    .screen { display: none; height: 100dvh; width: 100%; }
    .screen.active { display: flex; flex-direction: column; }

    /* SPLASH */
    #splashScreen {
      position: fixed; inset: 0;
      background: var(--white);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      transition: opacity 0.2s;
    }
    #splashScreen.hidden { opacity: 0; pointer-events: none; }

    /* LOGIN */
    #loginScreen { justify-content: center; align-items: center; padding: 24px 16px; }

    .login-card {
      background: var(--white);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .login-card h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .login-card p { font-size: 14px; color: var(--muted); margin-bottom: 24px; }

    .login-card input {
      display: block;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      background: var(--gray);
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    .login-card input:focus { border-color: var(--blue); background: var(--white); }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 15px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 10px;
    }
    .btn-primary:active { background: var(--blue-dark); transform: scale(0.98); }

    .btn-secondary {
      display: block;
      width: 100%;
      padding: 13px;
      background: transparent;
      color: var(--blue);
      border: 1.5px solid var(--blue);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s;
    }
    .btn-secondary:active { background: #eef4fd; }

    .error-msg { color: #e53935; font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }

    /* CHAT HEADER */
    .chat-header {
      background: var(--white);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      min-height: 56px;
    }

    .header-info { display: flex; align-items: center; gap: 10px; }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--blue);
      color: white;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-name { font-size: 15px; font-weight: 600; color: var(--text); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-sub { font-size: 12px; color: #31a24c; margin-top: 1px; }

    .btn-logout {
      padding: 8px 14px;
      background: var(--gray);
      border: none;
      border-radius: 20px;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .btn-logout:active { opacity: 0.7; }

    /* MESSAGES */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .msg-row { display: flex; flex-direction: column; max-width: 78%; }
    .msg-row.mine { align-self: flex-end; align-items: flex-end; }
    .msg-row.theirs { align-self: flex-start; align-items: flex-start; }

    .msg-sender { font-size: 11px; color: var(--muted); margin-bottom: 3px; padding: 0 6px; }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }
    .mine .msg-bubble { background: var(--bubble-me); color: white; border-bottom-right-radius: 5px; }
    .theirs .msg-bubble { background: var(--bubble-other); color: var(--text); border-bottom-left-radius: 5px; }

    /* media bubbles */
    .msg-bubble.media-bubble { padding: 4px; }
    .msg-bubble.media-bubble img {
      display: block;
      max-width: 240px;
      max-height: 300px;
      border-radius: 14px;
      cursor: pointer;
      object-fit: cover;
    }
    .msg-bubble.media-bubble video {
      display: block;
      max-width: 240px;
      max-height: 300px;
      border-radius: 14px;
    }
    .media-caption { padding: 6px 10px 4px; font-size: 14px; }

    .msg-time { font-size: 10px; color: var(--muted); margin-top: 3px; padding: 0 6px; }

    /* date divider */
    .date-divider {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin: 8px 0;
      position: relative;
    }
    .date-divider::before, .date-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 30%;
      height: 1px;
      background: var(--border);
    }
    .date-divider::before { left: 0; }
    .date-divider::after { right: 0; }

    /* PREVIEW BAR */
    .preview-bar {
      display: none;
      background: var(--white);
      border-top: 1px solid var(--border);
      padding: 8px 16px;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .preview-bar.visible { display: flex; }
    .preview-thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; }
    .preview-name { flex: 1; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preview-cancel { background: none; border: none; font-size: 20px; color: var(--muted); cursor: pointer; padding: 0 4px; line-height: 1; }

    /* PROGRESS BAR */
    .progress-bar-wrap {
      display: none;
      background: var(--white);
      border-top: 1px solid var(--border);
      padding: 8px 16px;
      flex-shrink: 0;
    }
    .progress-bar-wrap.visible { display: block; }
    .progress-label { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .progress-track { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--blue); border-radius: 4px; width: 0%; transition: width 0.15s; }

    /* INPUT BAR */
    .input-bar {
      background: var(--white);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .input-bar input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 11px 16px;
      border: 1.5px solid var(--border);
      border-radius: 22px;
      font-size: 15px;
      background: var(--gray);
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    .input-bar input[type="text"]:focus { border-color: var(--blue); background: var(--white); }

    #fileInput { display: none; }

    .btn-attach {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--gray);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-attach:active { background: var(--border); }

    .btn-send {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--blue);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-send:active { background: var(--blue-dark); transform: scale(0.93); }
    .btn-send svg { width: 18px; height: 18px; fill: white; }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 95vw; max-height: 90vh; border-radius: 8px; object-fit: contain; }
    .lightbox-close {
      position: absolute;
      top: 16px; right: 16px;
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      font-size: 22px;
      width: 40px; height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

<!-- SPLASH (скрывает мигание при загрузке) -->
<div id="splashScreen">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
  </svg>
</div>

<!-- LOGIN -->
<div id="loginScreen" class="screen">
  <div class="login-card">
    <h2>Добро пожаловать</h2>
    <p>Введите email и пароль</p>
    <input id="loginInput" placeholder="Email" type="email" autocomplete="username" autocorrect="off" autocapitalize="none">
    <input id="passInput" type="password" placeholder="Пароль" autocomplete="current-password">
    <button class="btn-primary" onclick="login()">Войти</button>
    <button class="btn-secondary" onclick="register()">Зарегистрироваться</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<!-- CHAT -->
<div id="chatScreen" class="screen">

  <div class="chat-header">
    <div class="header-info">
      <div class="avatar" id="avatarEl"></div>
      <div>
        <div class="header-name" id="headerName">Чат</div>
        <div class="header-sub">онлайн</div>
      </div>
    </div>
    <button class="btn-logout" onclick="logout()">Выйти</button>
  </div>

  <div id="messages"></div>

  <div class="preview-bar" id="previewBar">
    <img class="preview-thumb" id="previewThumb" src="" alt="">
    <span class="preview-name" id="previewName"></span>
    <button class="preview-cancel" onclick="cancelFile()">✕</button>
  </div>

  <div class="progress-bar-wrap" id="progressWrap">
    <div class="progress-label" id="progressLabel">Загрузка...</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="input-bar">
    <button class="btn-attach" onclick="document.getElementById('fileInput').click()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66L9.41 17.41a2 2 0 01-2.83-2.83l8.49-8.48"/>
      </svg>
    </button>
    <input type="file" id="fileInput" accept="image/*,video/*" onchange="onFileSelected(event)">
    <input type="text" id="msgInput" placeholder="Сообщение..." autocomplete="off">
    <button class="btn-send" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
let currentUser = null;
let pendingFile = null;

const firebaseConfig = {
  apiKey: "AIzaSyDjqI-fCpmUAc4S-kBDgYBCq-ezCzmsabU",
  authDomain: "chat-8bb2b.firebaseapp.com",
  databaseURL: "https://chat-8bb2b-default-rtdb.firebaseio.com/",
  projectId: "chat-8bb2b",
  storageBucket: "chat-8bb2b.firebasestorage.app",
  messagingSenderId: "248692438123",
  appId: "1:248692438123:web:acf2acf528f4a2e3186d2e"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();
const messaging = firebase.messaging();

/* NOTIFICATIONS */
async function enableNotifications() {
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;

    const registration = await navigator.serviceWorker.register('/chat/firebase-messaging-sw.js');
    
    // Ждём пока Service Worker станет активным
    await navigator.serviceWorker.ready;

    const token = await messaging.getToken({
      vapidKey: 'BEuelRAgm1hA3S5TAYN3uwIpIpvTy4-uwQMVoI5e7r_ueg4bDK2bgFs2FW2REQ75Rwoyn4aOqDGF0UueiEme8S4',
      serviceWorkerRegistration: registration
    });

    await db.ref('users/' + currentUser.uid).update({
      fcmToken: token,
      email: currentUser.email
    });
    console.log('Уведомления включены, токен:', token);
  } catch(e) {
    console.error('Ошибка уведомлений:', e);
  }
}

/* PERSIST SESSION */
auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    enterChat();
  } else {
    document.getElementById("loginScreen").classList.add("active");
  }
  const splash = document.getElementById("splashScreen");
  splash.classList.add("hidden");
  setTimeout(() => splash.remove(), 200);
});

/* AUTH */
function login() {
  const email = document.getElementById("loginInput").value.trim();
  const password = document.getElementById("passInput").value;
  const errorMsg = document.getElementById("errorMsg");

  auth.signInWithEmailAndPassword(email, password)
    .then(cred => { currentUser = cred.user; enterChat(); })
    .catch(err => { errorMsg.textContent = friendlyError(err.code); });
}

function register() {
  const email = document.getElementById("loginInput").value.trim();
  const password = document.getElementById("passInput").value;
  const errorMsg = document.getElementById("errorMsg");

  auth.createUserWithEmailAndPassword(email, password)
    .then(cred => { currentUser = cred.user; enterChat(); })
    .catch(err => { errorMsg.textContent = friendlyError(err.code); });
}

function friendlyError(code) {
  const map = {
    "auth/invalid-email": "Неверный формат email",
    "auth/user-not-found": "Пользователь не найден",
    "auth/wrong-password": "Неверный пароль",
    "auth/email-already-in-use": "Email уже используется",
    "auth/weak-password": "Пароль должен быть не менее 6 символов",
    "auth/invalid-credential": "Неверный email или пароль",
  };
  return map[code] || "Ошибка входа. Попробуйте ещё раз.";
}

function enterChat() {
  document.getElementById("loginScreen").classList.remove("active");
  document.getElementById("chatScreen").classList.add("active");
  document.getElementById("headerName").textContent = currentUser.email;
  document.getElementById("avatarEl").textContent = currentUser.email.slice(0,2).toUpperCase();
  listenMessages();
  enableNotifications();
  document.getElementById("msgInput").focus();
}

function logout() {
  auth.signOut().then(() => location.reload());
}

/* FILE SELECTION */
const MAX_SIZE = 50 * 1024 * 1024;

function onFileSelected(e) {
  const file = e.target.files[0];
  if (!file) return;

  if (file.size > MAX_SIZE) {
    alert("Файл слишком большой. Максимум 50 МБ.");
    e.target.value = "";
    return;
  }

  pendingFile = file;
  const previewThumb = document.getElementById("previewThumb");
  document.getElementById("previewName").textContent = file.name;

  if (file.type.startsWith("image/")) {
    previewThumb.src = URL.createObjectURL(file);
    previewThumb.style.display = "block";
  } else {
    previewThumb.style.display = "none";
  }

  document.getElementById("previewBar").classList.add("visible");
  e.target.value = "";
}

function cancelFile() {
  pendingFile = null;
  document.getElementById("previewBar").classList.remove("visible");
  document.getElementById("previewThumb").src = "";
}

/* SEND */
function sendMessage() {
  if (!currentUser) return;
  const text = document.getElementById("msgInput").value.trim();

  if (pendingFile) {
    uploadAndSend(pendingFile, text);
    cancelFile();
    document.getElementById("msgInput").value = "";
  } else if (text) {
    db.ref("messages").push({
      type: "text",
      text,
      uid: currentUser.uid,
      user: currentUser.email,
      time: Date.now()
    });
    document.getElementById("msgInput").value = "";
  }
}

/* UPLOAD */
function uploadAndSend(file, caption) {
  const isVideo = file.type.startsWith("video/");
  const ext = file.name.split('.').pop();
  const path = `chat_media/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const task = storage.ref(path).put(file);

  const progressWrap = document.getElementById("progressWrap");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");

  progressWrap.classList.add("visible");

  task.on("state_changed",
    snap => {
      const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
      progressFill.style.width = pct + "%";
      progressLabel.textContent = (isVideo ? "Видео" : "Фото") + " " + pct + "%";
    },
    err => {
      progressWrap.classList.remove("visible");
      progressFill.style.width = "0%";
      alert("Ошибка загрузки: " + err.message);
    },
    async () => {
      progressWrap.classList.remove("visible");
      progressFill.style.width = "0%";
      const url = await storage.ref(path).getDownloadURL();
      db.ref("messages").push({
        type: isVideo ? "video" : "image",
        url,
        caption: caption || "",
        uid: currentUser.uid,
        user: currentUser.email,
        time: Date.now()
      });
    }
  );
}

/* LISTEN */
function listenMessages() {
  db.ref("messages").on("value", snapshot => {
    const container = document.getElementById("messages");
    container.innerHTML = "";
    let lastDate = null;

    snapshot.forEach(child => {
      const msg = child.val();
      const dateStr = formatDate(msg.time);

      if (dateStr !== lastDate) {
        const div = document.createElement("div");
        div.className = "date-divider";
        div.textContent = dateStr;
        container.appendChild(div);
        lastDate = dateStr;
      }

      const isMine = msg.user === currentUser.email;
      const row = document.createElement("div");
      row.className = "msg-row " + (isMine ? "mine" : "theirs");

      if (!isMine) {
        const sender = document.createElement("div");
        sender.className = "msg-sender";
        sender.textContent = msg.user;
        row.appendChild(sender);
      }

      const bubble = document.createElement("div");

      if (msg.type === "image") {
        bubble.className = "msg-bubble media-bubble";
        const img = document.createElement("img");
        img.src = msg.url;
        img.loading = "lazy";
        img.onclick = () => openLightbox(msg.url);
        bubble.appendChild(img);
        if (msg.caption) {
          const cap = document.createElement("p");
          cap.className = "media-caption";
          cap.style.color = isMine ? "white" : "var(--text)";
          cap.textContent = msg.caption;
          bubble.appendChild(cap);
        }
      } else if (msg.type === "video") {
        bubble.className = "msg-bubble media-bubble";
        const vid = document.createElement("video");
        vid.src = msg.url;
        vid.controls = true;
        vid.playsInline = true;
        vid.preload = "metadata";
        bubble.appendChild(vid);
        if (msg.caption) {
          const cap = document.createElement("p");
          cap.className = "media-caption";
          cap.style.color = isMine ? "white" : "var(--text)";
          cap.textContent = msg.caption;
          bubble.appendChild(cap);
        }
      } else {
        bubble.className = "msg-bubble";
        bubble.textContent = msg.text || "";
      }

      row.appendChild(bubble);

      const time = document.createElement("div");
      time.className = "msg-time";
      time.textContent = formatTime(msg.time);
      row.appendChild(time);

      container.appendChild(row);
    });

    container.scrollTop = container.scrollHeight;
  });
}

/* LIGHTBOX */
function openLightbox(url) {
  document.getElementById("lightboxImg").src = url;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
}

/* UTILS */
function formatTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function formatDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return "Сегодня";
  const y = new Date(now); y.setDate(now.getDate()-1);
  if (d.toDateString() === y.toDateString()) return "Вчера";
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}

document.getElementById("msgInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById("passInput").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});
</script>
</body>
</html>
