<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Чат</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #4a90e2;
      --blue-dark: #3a7bd5;
      --gray: #f0f2f5;
      --border: #e4e6ea;
      --text: #1c1e21;
      --muted: #65676b;
      --white: #ffffff;
      --bubble-me: #0084ff;
      --bubble-other: #e4e6ea;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray);
      color: var(--text);
      font-size: 16px;
    }

    /* ── SCREENS ── */
    .screen { display: none; height: 100dvh; }
    .screen.active { display: flex; flex-direction: column; }

    /* ── LOGIN ── */
    #loginScreen {
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
    }

    .login-card {
      background: var(--white);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .login-card h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    .login-card p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .login-card input {
      display: block;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      background: var(--gray);
      color: var(--text);
      transition: border-color 0.2s;
      outline: none;
      -webkit-appearance: none;
    }

    .login-card input:focus {
      border-color: var(--blue);
      background: var(--white);
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 15px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-primary:active { background: var(--blue-dark); transform: scale(0.98); }

    .error-msg {
      color: #e53935;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
      min-height: 18px;
    }

    /* ── CHAT ── */
    #chatScreen { background: var(--gray); }

    /* header */
    .chat-header {
      background: var(--white);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 10;
      min-height: 56px;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--blue);
      color: white;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .header-sub {
      font-size: 12px;
      color: #31a24c;
      margin-top: 1px;
    }

    .btn-logout {
      padding: 8px 14px;
      background: var(--gray);
      border: none;
      border-radius: 20px;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-logout:active { opacity: 0.7; }

    /* messages area */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }

    .msg-row.mine { align-self: flex-end; align-items: flex-end; }
    .msg-row.theirs { align-self: flex-start; align-items: flex-start; }

    .msg-sender {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
      padding: 0 6px;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }

    .mine .msg-bubble {
      background: var(--bubble-me);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .theirs .msg-bubble {
      background: var(--bubble-other);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }

    .msg-time {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      padding: 0 6px;
    }

    /* date divider */
    .date-divider {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin: 8px 0;
      position: relative;
    }

    .date-divider::before, .date-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 30%;
      height: 1px;
      background: var(--border);
    }

    .date-divider::before { left: 0; }
    .date-divider::after { right: 0; }

    /* input bar */
    .input-bar {
      background: var(--white);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .input-bar input {
      flex: 1;
      padding: 11px 16px;
      border: 1.5px solid var(--border);
      border-radius: 22px;
      font-size: 15px;
      background: var(--gray);
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }

    .input-bar input:focus {
      border-color: var(--blue);
      background: var(--white);
    }

    .btn-send {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--blue);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-send:active { background: var(--blue-dark); transform: scale(0.93); }

    .btn-send svg { width: 18px; height: 18px; fill: white; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <div class="login-card">
    <h2>Добро пожаловать</h2>
    <p>Войдите, чтобы начать общение</p>

    <input id="loginInput" placeholder="Логин" autocomplete="username" autocorrect="off" autocapitalize="none">
    <input id="passInput" type="password" placeholder="Пароль" autocomplete="current-password">

    <button class="btn-primary" onclick="login()">Войти</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<!-- CHAT -->
<div id="chatScreen" class="screen">

  <div class="chat-header">
    <div class="header-info">
      <div class="avatar" id="avatarEl"></div>
      <div>
        <div class="header-name" id="headerName">Чат</div>
        <div class="header-sub">онлайн</div>
      </div>
    </div>
    <button class="btn-logout" onclick="logout()">Выйти</button>
  </div>

  <div id="messages"></div>

  <div class="input-bar">
    <input id="msgInput" placeholder="Сообщение..." autocomplete="off">
    <button class="btn-send" onclick="sendMessage()" id="sendBtn">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<script>
const users = {
  serge: { password: "1111", name: "Серж" },
  masha: { password: "2222", name: "Маша" },
  boris: { password: "3333", name: "Боря" }
};

let currentUser = null;

const firebaseConfig = {
  apiKey: "AIzaSyDjqI-fCpmUAc4S-kBDgYBCq-ezCzmsabU",
  authDomain: "chat-8bb2b.firebaseapp.com",
  databaseURL: "https://chat-8bb2b-default-rtdb.firebaseio.com/",
  projectId: "chat-8bb2b",
  storageBucket: "chat-8bb2b.appspot.com",
  messagingSenderId: "248692438123",
  appId: "1:248692438123:web:acf2acf528f4a2e3186d2e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function login() {
  const login = document.getElementById("loginInput").value.trim();
  const pass = document.getElementById("passInput").value;
  const errorMsg = document.getElementById("errorMsg");

  if (users[login] && users[login].password === pass) {
    currentUser = users[login].name;
    errorMsg.textContent = "";

    document.getElementById("loginScreen").classList.remove("active");
    document.getElementById("chatScreen").classList.add("active");

    const initials = currentUser.slice(0, 2).toUpperCase();
    document.getElementById("avatarEl").textContent = initials;
    document.getElementById("headerName").textContent = currentUser;

    listenMessages();
    document.getElementById("msgInput").focus();
  } else {
    errorMsg.textContent = "Неверный логин или пароль";
    document.getElementById("passInput").value = "";
  }
}

function logout() {
  location.reload();
}

function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;

  db.ref("messages").push({
    text: text,
    user: currentUser,
    time: Date.now()
  });

  input.value = "";
  input.focus();
}

document.getElementById("msgInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

document.getElementById("passInput").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});

function formatTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function formatDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return "Сегодня";
  const yesterday = new Date(now); yesterday.setDate(now.getDate()-1);
  if (d.toDateString() === yesterday.toDateString()) return "Вчера";
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}

function listenMessages() {
  db.ref("messages").on("value", snapshot => {
    const container = document.getElementById("messages");
    container.innerHTML = "";

    let lastDate = null;

    snapshot.forEach(child => {
      const msg = child.val();
      const dateStr = formatDate(msg.time);

      if (dateStr !== lastDate) {
        const divider = document.createElement("div");
        divider.className = "date-divider";
        divider.textContent = dateStr;
        container.appendChild(divider);
        lastDate = dateStr;
      }

      const isMine = msg.user === currentUser;
      const row = document.createElement("div");
      row.className = "msg-row " + (isMine ? "mine" : "theirs");

      if (!isMine) {
        const sender = document.createElement("div");
        sender.className = "msg-sender";
        sender.textContent = msg.user;
        row.appendChild(sender);
      }

      const bubble = document.createElement("div");
      bubble.className = "msg-bubble";
      bubble.textContent = msg.text;
      row.appendChild(bubble);

      const time = document.createElement("div");
      time.className = "msg-time";
      time.textContent = formatTime(msg.time);
      row.appendChild(time);

      container.appendChild(row);
    });

    container.scrollTop = container.scrollHeight;
  });
}
</script>

</body>
</html>
